spring.application.name=desafioacthildebertomelo
# ===============================
# Configurações do Servidor
# ===============================
server.port=8080

# ===============================
# Profile do banco de dados
# ===============================
spring.profiles.active=mysql


# ===============================
# Configurações do Banco de Dados
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/kanban_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# Configurações JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false




# ===============================
# Configurações de Logging
# ===============================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# Swagger / OpenAPI
# ===============================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


# ===============================
# Logging estruturado com Logback + Logstash
# ===============================
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.com.kanban=DEBUG

# Saída em JSON
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %highlight(%-5level) %logger{36} - %msg%n

# Caminho para acessar a interface gráfica do Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Caminho para acessar o JSON/YAML do OpenAPI de forma pública
springdoc.api-docs.path=/v3/api-docs

# Habilita a interface do Swagger UI
springdoc.swagger-ui.enabled=true

